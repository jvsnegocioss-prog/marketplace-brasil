name: Disposable reconciliation audit SQL test

on:
  push:
    branches:
      - fix/checkout-stock-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Run SQL security and integrity tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: audit_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/admin-reconciliation-audit.sql
