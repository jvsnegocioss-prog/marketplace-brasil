name: Checkout isolated contract tests

on:
  push:
    branches:
      - test/checkout-isolated-homologation
    paths:
      - 'app/api/checkout/route.ts'
      - 'tests/checkout-route-contract.test.cjs'
      - '.github/workflows/checkout-isolated-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checkout route contract tests
        run: node --test tests/checkout-route-contract.test.cjs
