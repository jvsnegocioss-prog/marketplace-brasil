name: Mercado Pago security tests

on:
  push:
    branches:
      - audit/mercadopago-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated tests
        run: npm test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and create a runner-only lockfile
        run: npm install --ignore-scripts
      - name: Report resolved React versions
        run: npm ls react react-dom --depth=0
      - name: Audit dependency tree
        run: npm audit --audit-level=high
