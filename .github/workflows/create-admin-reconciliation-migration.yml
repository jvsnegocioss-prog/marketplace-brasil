name: Generate formal reconciliation audit migration

on:
  push:
    branches:
      - fix/checkout-stock-recovery
    paths:
      - .github/workflows/create-admin-reconciliation-migration.yml

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/checkout-stock-recovery
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration using Supabase CLI
        shell: bash
        run: |
          supabase migration new admin_reconciliation_audit
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_admin_reconciliation_audit.sql' -print -quit)"
          test -n "$migration_file"
          test -f "$migration_file"
          cp docs/sql-drafts/admin-reconciliation-audit.draft.sql "$migration_file"
          echo "Created migration: $migration_file"
      - name: Commit migration to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_admin_reconciliation_audit.sql
          git commit -m "db: add formal reconciliation audit migration"
          git push origin HEAD:fix/checkout-stock-recovery
